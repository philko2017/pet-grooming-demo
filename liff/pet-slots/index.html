<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'">
  <title>查空檔｜溫莎城堡寵物沙龍</title>
  <link rel="stylesheet" href="../../shared/common.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-top">
        <span class="brand-tag">🐾 溫莎城堡寵物沙龍</span>
        <span class="mock-badge hidden" id="mockBadge">預覽模式</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px;">
        <div>
          <h1 class="header-title">查詢可預約時段</h1>
          <p class="header-sub">點選「可約」直接開啟 LINE 詢問預約</p>
        </div>
        <button type="button" class="btn btn-outline btn-sm" id="btnRefresh" style="background:rgba(255,255,255,0.18);color:#FFF;border-color:rgba(255,255,255,0.38);">重新整理</button>
      </div>
    </header>

    <main class="page-body" id="slotsMain"></main>

    <div class="sticky-footer">
      <div class="sticky-footer-inner">
        <a class="btn btn-primary btn-block" id="btnFooterAsk" href="#">💬 用 LINE 詢問預約</a>
      </div>
    </div>
  </div>

  <script src="../../shared/config.js"></script>
  <script src="../../shared/api.js"></script>
  <script src="./app.js"></script>
</body>
</html>
